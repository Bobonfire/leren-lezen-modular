name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required files
        shell: bash
        run: |
          test -f AGENTS.md
          test -f .codex/config.toml
          test -d .codex/agents
          test -d .agents/skills
          test ! -e ai
          test ! -e ai-agents
          test -f .codex/agents/orchestrator.toml
          test -f .codex/agents/product_owner.toml
          test -f .codex/agents/developer.toml
          test -f .codex/agents/tester.toml
          test -f .codex/agents/reviewer.toml
          test -f .codex/agents/documentation.toml
          test -f .codex/agents/refactor.toml
          test -f docs/agents/README.md
          test -f docs/agents/workflows/github-orchestration.md
          test -f docs/agents/workflows/fast-delivery.md
          test -f docs/agents/workflows/full-delivery.md
          test -f docs/agents/workflows/refactoring.md
          test -f docs/engineering/code-quality.md
          test -f docs/engineering/code-security.md
          test -f docs/engineering/project-structure.md
          test -f docs/engineering/project-structure.svg
          test -f .github/workflows/agent-orchestrator.yml
          test -f .github/ISSUE_TEMPLATE/feature.yml
          test -f .github/ISSUE_TEMPLATE/bug.yml
          test -f .github/pull_request_template.md

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
          node --check scripts/smoke-test.mjs
          node --check scripts/app-interaction-test.mjs
          node --check scripts/build-browser-bundle.mjs
          node --check scripts/agent-orchestrator.mjs
          node --check scripts/agent-orchestrator-test.mjs
          node --check scripts/validate-agent-config.mjs

      - name: Validate browser bundle
        shell: bash
        run: node scripts/build-browser-bundle.mjs --check

      - name: Validate Codex agents and skills
        shell: bash
        run: node scripts/validate-agent-config.mjs

      - name: Test agent workflow routing
        shell: bash
        run: node scripts/agent-orchestrator-test.mjs

      - name: Run smoke test
        shell: bash
        run: |
          node scripts/smoke-test.mjs
          node scripts/app-interaction-test.mjs
