name: Agent Orchestrator

on:
  push:
    branches-ignore:
      - main
      - dev
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - reopened
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - dismissed
  issue_comment:
    types:
      - created
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  orchestrate:
    name: Route and publish agent workflow state
    runs-on: ubuntu-latest
    concurrency:
      group: agent-orchestrator-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Route workflow and update GitHub state
        id: orchestrator
        env:
          AGENT_ORCHESTRATOR_MODE: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'dry-run' || 'mutate' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent-orchestrator.mjs
