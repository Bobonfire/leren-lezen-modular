name: Agent Orchestrator

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - reopened
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  issue_comment:
    types:
      - created
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  dry-run:
    name: Determine next agent step
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run orchestrator dry-run
        env:
          AGENT_ORCHESTRATOR_MODE: dry-run
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/agent-orchestrator.mjs
